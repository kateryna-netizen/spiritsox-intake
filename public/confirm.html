<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Send to Spirit Sox</title>
<style>
  body{font-family:Inter,Arial,sans-serif;background:#f6f7f9;margin:0;padding:24px}
  .card{max-width:760px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.06);padding:24px}
  h1{margin:0 0 12px;font-size:22px}
  p{color:#4a4a4a}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
  th{width:220px;color:#333}
  .actions{display:flex;gap:12px;margin-top:20px}
  button{padding:12px 18px;border-radius:12px;border:0;cursor:pointer}
  .primary{background:#0B8F3E;color:#fff}
  .muted{background:#eef0f2}
  pre{background:#f7f7f7;padding:12px;border-radius:8px;overflow:auto}
  .ok{color:#0B8F3E}
  .err{color:#B00020}
</style>
</head>
<body>
<div class="card">
  <h1>Review your Spirit Sox order</h1>
  <p>Make sure the details look right, then click <b>Send to Spirit Sox</b>.</p>
  <div id="summary"></div>
  <div class="actions">
    <button class="primary" id="sendBtn">Send to Spirit Sox</button>
    <button class="muted" onclick="history.back()">Go back</button>
  </div>
  <p id="status"></p>
</div>
<script>
  // base64url decode helper
  function b64urlDecode(s){ if(!s) return ""; s=s.replace(/-/g,'+').replace(/_/g,'/'); return atob(s.padEnd(s.length + (4-(s.length%4))%4,'=')); }

  // read payload from ?p=
  const params = new URLSearchParams(location.search);
  let data = {};
  try {
    const raw = params.get('p');
    if (raw) data = JSON.parse(b64urlDecode(raw));
  } catch(e) {
    console.error(e);
  }

  // Render a neat table
  const labels = {
    name: "Name",
    org: "Organization",
    email: "Email",
    phone: "Phone",
    style: "Sock style",
    qty: "Quantity",
    sizes: "Sizes",
    due: "Due date",
    colorsAllowed: "Colors allowed",
    colors: "Colors",
    hex: "Brand HEX",
    artwork: "Artwork link",
    notes: "Notes"
  };
  const row = (k,v) => `<tr><th>${k}</th><td>${Array.isArray(v)?v.join(', '):(v ?? '')}</td></tr>`;
  const html = `<table>${
    Object.entries(labels).map(([key,label]) => row(label, data[key]))
      .join('')
  }</table>
  <details style="margin-top:12px"><summary>Show technical details</summary>
    <pre>${JSON.stringify(data, null, 2)}</pre>
  </details>`;
  document.getElementById('summary').innerHTML = html;

  // Send to your Vercel API
  const statusEl = document.getElementById('status');
  document.getElementById('sendBtn').onclick = async () => {
    statusEl.textContent = 'Sending…';
    try {
      const res = await fetch('/api/lead-intake', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
      if (res.ok) {
        statusEl.innerHTML = '✅ <span class="ok">Sent! Our team will follow up shortly.</span>';
      } else {
        statusEl.innerHTML = '❌ <span class="err">Error: '+ await res.text() +'</span>';
      }
    } catch(e) {
      statusEl.innerHTML = '❌ <span class="err">Error: '+ e.message +'</span>';
    }
  };
</script>
</body>
</html>
